name: Expire Quotes Hourly Cron

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: "0 * * * *"
  # Allows manual trigger from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  trigger-expire-quotes:
    name: Trigger Quote Expiry Check
    runs-on: ubuntu-latest
    # A hung request must not hold the job for the default six hours.
    timeout-minutes: 5
    steps:
      # A missing secret made every run a no-op that looked healthy in the tab.
      # Check the configuration first so the failure is visible and annotated.
      - name: Verify required secrets
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""

          if [ -z "$PRODUCTION_URL" ]; then missing="$missing PRODUCTION_URL"; fi
          if [ -z "$CRON_SECRET" ]; then missing="$missing CRON_SECRET"; fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. The hourly quote sweep cannot run. Configure them per DEPLOYMENT.md -> Cron alerting."
            exit 1
          fi

          case "$PRODUCTION_URL" in
            https://*) ;;
            *)
              echo "::error::PRODUCTION_URL must be an https:// URL (got a value without that scheme)."
              exit 1
              ;;
          esac

      - name: Call Next.js Expire Quotes Endpoint
        id: cron
        run: |
          TIMESTAMP=$(date +%s%3N)  # milliseconds since epoch
          PAYLOAD=""  # empty body for this endpoint
          SIGNATURE=$(echo -n "${TIMESTAMP}|${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.CRON_SECRET }}" | sed "s/^.* //")
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          # Only the timestamp and its HMAC are sent: the route rejects any
          # request without a valid signature, so the raw secret never travels.
          curl --fail-with-body -sS -X POST \
            -H "x-cron-timestamp: $TIMESTAMP" \
            -H "x-cron-signature: $SIGNATURE" \
            "${{ secrets.PRODUCTION_URL }}/api/admin/requests/quotes/expire"

      # GitHub schedules are best-effort: a run can be delayed or skipped under
      # load, and nothing retries it. Say so in the summary, and push to an
      # optional webhook so a silent failure does not look like "no quotes ever
      # expire". Unset ALERT_WEBHOOK_URL, the step only writes the summary.
      - name: Report a failed run
        if: failure()
        run: |
          {
            echo "### Quote expiry run failed"
            echo ""
            echo "The hourly sweep did not complete, so quotes due since the last"
            echo "successful run are still un-expired. Scheduled runs can also be"
            echo "delayed or skipped by GitHub — check the run history before"
            echo "assuming the endpoint itself is broken."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            curl --fail-with-body -sS -X POST \
              -H 'Content-Type: application/json' \
              -d '{"text":"ShipIN: the hourly quote-expiry run failed."}' \
              "${{ secrets.ALERT_WEBHOOK_URL }}" || true
          else
            # No alert channel: make the gap a hard annotation on the run rather
            # than a summary nobody opens. This is configuration, not a flake.
            echo "::error::ALERT_WEBHOOK_URL is not set, so this failure reached nobody. Configure the repository secret (see DEPLOYMENT.md -> Cron alerting)."
          fi
