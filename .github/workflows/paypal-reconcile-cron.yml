name: PayPal Reconciliation Daily Cron

on:
  schedule:
    # 03:10 UTC daily — after the retention purge, before business hours in
    # Mumbai, so drift found overnight is waiting for someone at 08:40 IST.
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert only; do not call reconciliation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-test-alert:
    name: Send Test Alert
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::error::ALERT_WEBHOOK_URL is not set, so the test alert reached nobody. Configure the repository secret (see DEPLOYMENT.md -> Cron alerting)."
            exit 1
          fi

          text="ShipIN TEST ALERT: PayPal reconciliation paging is reachable. This is a manual test; reconciliation was not run and no action is required. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg text "$text" '{text: $text}')

          delivered=0
          for attempt in 1 2 3; do
            if curl --fail-with-body -sS --max-time 10 -X POST \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$ALERT_WEBHOOK_URL"; then
              delivered=1
              break
            fi
            echo "::warning::Test alert attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

          if [ "$delivered" -ne 1 ]; then
            echo "::error::Test alert delivery failed after 3 attempts; the webhook did not accept it."
            exit 1
          fi

          {
            echo "### Test alert delivered"
            echo ""
            echo "The manual test reached \`ALERT_WEBHOOK_URL\`. This run did not call reconciliation and did not change payment state."
            echo ""
            echo "Confirm the message appears in the paging channel. A webhook can accept a request that no human sees."
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-paypal-reconciliation:
    name: Reconcile PayPal Payments
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_alert != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""

          if [ -z "$PRODUCTION_URL" ]; then missing="$missing PRODUCTION_URL"; fi
          if [ -z "$CRON_SECRET" ]; then missing="$missing CRON_SECRET"; fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. The payment reconciliation cannot run, so a charge that never settled stays invisible until a customer complains."
            exit 1
          fi

          case "$PRODUCTION_URL" in
            https://*) ;;
            *)
              echo "::error::PRODUCTION_URL must be an https:// URL (got a value without that scheme)."
              exit 1
              ;;
          esac

      - name: Call PayPal reconciliation endpoint
        run: |
          RESPONSE_FILE="$RUNNER_TEMP/reconcile-response.json"
          echo "RECONCILE_RESPONSE_FILE=$RESPONSE_FILE" >> "$GITHUB_ENV"
          TIMESTAMP=$(date +%s%3N)
          PAYLOAD=""
          SIGNATURE=$(echo -n "${TIMESTAMP}|${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.CRON_SECRET }}" | sed "s/^.* //")
          status=0
          curl --fail-with-body -sS -X POST \
            -H "x-cron-timestamp: $TIMESTAMP" \
            -H "x-cron-signature: $SIGNATURE" \
            -o "$RESPONSE_FILE" \
            "${{ secrets.PRODUCTION_URL }}/api/admin/payments/reconcile" || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::PayPal reconciliation returned an error (curl exit $status; 22 means an HTTP 4xx/5xx, and a 409 body is a drift report)."
            exit "$status"
          fi

      # A non-2xx answer is either drift (409) or the endpoint failing. Both are
      # worth a human: the first means money and state disagree somewhere.
      - name: Page on drift or failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          drift_count="unknown"
          response_file="${RECONCILE_RESPONSE_FILE:-}"

          if [ -n "$response_file" ] && [ -f "$response_file" ]; then
            drift_count=$(jq -r 'if (.drift | type) == "array" then (.drift | length) else "unknown" end' "$response_file" 2>/dev/null || echo unknown)
            {
              echo "### PayPal reconciliation needs a human"
              echo ""
              echo "Drift entries: $drift_count"
              echo ""
              echo '```json'
              head -c 6000 "$response_file"
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### PayPal reconciliation could not run"
              echo ""
              echo "No response body was captured, so this is a transport or configuration failure rather than a drift report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Runbook: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/OPERATIONS.md#8-payment-reconciliation-drift"
            echo ""
            echo "The endpoint answers 409 when a completed PayPal order is not reflected on its request, or a paid request has no completed order. The last verdict is also kept at system/paymentReconciliation in Firestore. Confirm the capture in the PayPal dashboard before changing anything on the request. Scheduled runs can also be delayed or skipped by GitHub — check the run history before assuming the endpoint itself is broken."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::error::ALERT_WEBHOOK_URL is not set, so this failure reached nobody. Configure the repository secret (see DEPLOYMENT.md -> Cron alerting)."
            exit 1
          fi

          text="ShipIN PayPal reconciliation needs a human (drift entries: $drift_count). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg text "$text" '{text: $text}')

          delivered=0
          for attempt in 1 2 3; do
            if curl --fail-with-body -sS --max-time 10 -X POST \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$ALERT_WEBHOOK_URL"; then
              delivered=1
              break
            fi
            echo "::warning::Alert webhook attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

          if [ "$delivered" -ne 1 ]; then
            echo "::error::Alert webhook delivery failed after 3 attempts; the drift report reached nobody."
            exit 1
          fi
