name: Weekly Security Audit

# The security audit used to run on every push from `ci.yml`. Its verdict only
# changes when dependencies do, so a push that touches no manifest paid a
# runner to re-derive a result that was already known.
#
# Accessibility is not here at all: `src/lib/axeScan.test.ts` and
# `axeScan.test.tsx` match the suite's `src/**/*.test.{ts,tsx}` include, so the
# normal `Tests` job runs them on every push. A separate job re-ran one of those
# two files and nothing else.
#
# Moving the audit here does not drop the check — it changes how fast a failure
# interrupts you:
#
#   - `audit:gate` (production closure, high/critical, allowlist with expiry)
#     and the unpinned-dependency report run weekly;
#   - advisories are still judged DAILY by `dependency-gate.yml`, which runs
#     `audit:gate` and `check:licenses` against the committed lockfile;
#   - this run adds the lockfile-integrity verdict
#     (`npm ci --package-lock-only`), which the daily gate does not take.
#
# No build is needed, so the job stays cheap: install and assert.
on:
  schedule:
    # Mondays 04:47 UTC — after the daily dependency gate (04:20) so a licence
    # or advisory verdict arrives before this one. Off the hour to avoid
    # queueing behind the other crons.
    - cron: "47 4 * * 1"
  # A release can ask for this verdict without waiting for Monday.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

concurrency:
  # Verdicts are the point, so a newer run must not cancel one mid-install.
  group: weekly-audits
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production dependencies, high/critical)
        # Build/test tooling is excluded, and the one remaining advisory that
        # has no fixed release is allowlisted with a dated expiry in
        # scripts/audit-gate.mjs. Everything else fails the job.
        run: npm run audit:gate

      - name: Report unpinned dependencies
        # Advisory only. The manifest intentionally uses caret ranges, so a
        # hard failure here would turn every run red without changing anything.
        run: |
          UNPINNED=$(jq -r '.dependencies | to_entries[] | select(.value | startswith("^") or startswith("~")) | "\(.key): \(.value)"' apps/web/package.json)
          if [ -n "$UNPINNED" ]; then
            echo "::warning::Dependencies using caret/tilde ranges:"
            echo "$UNPINNED"
          fi

      - name: Verify lockfile integrity
        run: npm ci --package-lock-only --ignore-scripts
