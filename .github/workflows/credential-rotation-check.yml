name: Credential Rotation Check

on:
  schedule:
    # Run on the 1st of each month at 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual check"

jobs:
  check-rotation:
    name: Check Credential Rotation Dates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # Same lockfile and workspace install as every other job; a bare
        # `npm install` in the app rewrote dependencies and ignored the root
        # lockfile this repository depends on.
        run: npm ci

      - name: Check credential rotation dates
        id: check-rotation
        # Run from project root (github.workspace)
        run: |
          node scripts/check-credential-rotation.js > rotation-check-output.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # Output the results for the job summary
          echo "rotation-check-results<<EOF" >> $GITHUB_OUTPUT
          cat rotation-check-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post check results to job summary
        if: always()
        run: |
          echo "### 🔑 Credential Rotation Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat rotation-check-output.txt >> $GITHUB_STEP_SUMMARY

      - name: Flag overdue credentials
        if: steps.check-rotation.outputs.exit_code != '0'
        run: |
          echo "⚠️ One or more credentials are overdue for rotation"
          echo "Please review and rotate the overdue credentials as documented in docs/OPERATIONS.md §9"
          exit 1