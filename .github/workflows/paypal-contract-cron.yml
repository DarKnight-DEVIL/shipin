name: PayPal Contract Daily

# `ci.yml` runs the sandbox contract suite on every push and PR. That leaves the
# quiet case uncovered: PayPal ships a change while nobody is committing, the
# suite does not run, and the first anyone learns of it is the next push. This
# runs the same suite once a day against the sandbox.
#
# It cannot move money: creating an order charges nothing, and the capture and
# refund cases only assert PayPal's *failures* (ORDER_NOT_APPROVED,
# INVALID_RESOURCE_ID). It uses its own sandbox application
# (`PAYPAL_CONTRACT_CLIENT_ID` / `PAYPAL_CONTRACT_CLIENT_SECRET`), never the live
# credentials, and the suite forces the sandbox host regardless of the caller's
# environment.
on:
  schedule:
    # 05:10 UTC — after the nightly tests and the dependency gate, before the
    # working day in Mumbai.
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

concurrency:
  group: paypal-contract
  cancel-in-progress: false

jobs:
  contract:
    name: PayPal sandbox contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYPAL_CONTRACT_CLIENT_ID: ${{ secrets.PAYPAL_CONTRACT_CLIENT_ID }}
      PAYPAL_CONTRACT_CLIENT_SECRET: ${{ secrets.PAYPAL_CONTRACT_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      # The suite *skips* itself without credentials and still exits 0, which on
      # a scheduled run would be indistinguishable from a passing contract: a
      # deleted or renamed secret would leave this job green forever while
      # proving nothing. On push that is a soft warning so forks stay green;
      # here it is a failure.
      - name: Verify the sandbox credentials exist
        run: |
          missing=""

          if [ -z "${PAYPAL_CONTRACT_CLIENT_ID// /}" ]; then missing="$missing PAYPAL_CONTRACT_CLIENT_ID"; fi
          if [ -z "${PAYPAL_CONTRACT_CLIENT_SECRET// /}" ]; then missing="$missing PAYPAL_CONTRACT_CLIENT_SECRET"; fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. The daily PayPal contract run would skip every test, so it cannot prove PayPal still accepts our requests. Configure a sandbox application's credentials (see DEPLOYMENT.md -> Cron alerting)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run the PayPal sandbox contract suite
        run: |
          set -euo pipefail
          log="$(mktemp)"

          set +e
          npm run test:contract 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e

          # Belt and braces for the secrets check above: a whitespace-only secret
          # passes `-n` but leaves the suite skipped, and a green scheduled run
          # that verified nothing is the failure mode this job exists to avoid.
          if grep -qE "Tests +[0-9]+ skipped \(" "$log"; then
            echo "::error::The contract suite skipped its tests. Nothing verified that PayPal still accepts the request bodies we send."
            status=1
          fi

          exit "$status"

      # A scheduled failure is attached to no commit anyone is watching, so
      # mirror the other crons: a summary that says what broke and an optional
      # webhook. Silence is the wrong default for a provider change.
      - name: Report a failed run
        if: failure()
        run: |
          {
            echo "### PayPal sandbox contract failed"
            echo ""
            echo "The daily contract run did not pass. Either PayPal changed something"
            echo "on their side (an endpoint, a required field, an error shape) or this"
            echo "repository's sandbox credentials are no longer valid — the output above"
            echo "says which. Nothing was pushed to trigger this: it is the daily check"
            echo "against a quiet repository. Reproduce locally with:"
            echo ""
            echo '```'
            echo "PAYPAL_CONTRACT_CLIENT_ID=… PAYPAL_CONTRACT_CLIENT_SECRET=… npm run test:contract"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            curl --fail-with-body -sS -X POST \
              -H 'Content-Type: application/json' \
              -d '{"text":"ShipIN: the daily PayPal sandbox contract run failed — PayPal may have changed its API, or the sandbox credentials are invalid."}' \
              "${{ secrets.ALERT_WEBHOOK_URL }}" || true
          else
            echo "::error::ALERT_WEBHOOK_URL is not set, so this failure reached nobody. Configure the repository secret (see DEPLOYMENT.md -> Cron alerting)."
          fi
