name: CI

on:
  push:
    branches: [main, develop]
  # `types: [opened, synchronize, reopened]` means PRs from forks
  # (which use the `pull_request_target`-style token) still run on the
  # base repo's config. Without `reopened`, a PR that is closed and
  # re-opened will not re-trigger CI.
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# A newer commit on the same ref makes the previous run's result moot, and
# cancelling it stops paying for the E2E build. A push to main is left alone:
# those runs are the record of what landed, so they are allowed to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  # ─── Secret scanning ────────────────────────────────────────────────────────
  # A committed FIREBASE_ADMIN_PRIVATE_KEY or PayPal secret is a full
  # compromise, so scan every push and PR for verified credentials.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      # A UTF-16 workflow file is invisible to GitHub: no run, no failure, no
      # notification. expire-quotes-cron.yml sat that way, so the hourly job
      # never ran at all. Encoding needs a machine, not a reviewer.
      - name: Verify workflow files are UTF-8 YAML
        run: npm run check:workflows

      # Parses every Firestore query with the TypeScript compiler and fails when
      # one needs a composite index that firestore.indexes.json does not declare.
      # The dashboard list once shipped without its index and every page load
      # failed with FAILED_PRECONDITION; this turns that into a static check.
      - name: Verify Firestore indexes cover the queries
        run: npm run check:firestore-indexes

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # Optional: when these repository secrets exist, @sentry/nextjs
          # uploads source maps during the build so stack traces stay readable.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # Dummy env vars, kept so the CI build matches a real deployment.
          #
          # They are not what keeps the build alive: client env is validated
          # where it is used, not at import time, so a clean build with every
          # NEXT_PUBLIC_* unset compiles and prerenders all static pages (the
          # lazy Firebase handles in src/lib/firebase.ts and firebaseDb.ts are
          # what made that true). They stay because NEXT_PUBLIC_* values are
          # inlined into the client bundle at build time, and a bundle compiled
          # without them ships an empty Firebase config that cannot sign anyone
          # in. The bundle-budget job builds with these values; the e2e job gets
          # its own from scripts/e2e-local.mjs, which points Firebase at the
          # emulators instead.
          PAYPAL_CLIENT_ID: "test"
          PAYPAL_CLIENT_SECRET: "test"
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "test"
          APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          RESEND_API_KEY: "test"
          NEXT_PUBLIC_FIREBASE_API_KEY: "test"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "test.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "test"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "test-bucket"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:abcdef"
          PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
          PAYPAL_ENV: "sandbox"
          SMTP_EMAIL: "test@test.com"
          SMTP_PASSWORD: "test"
          FIREBASE_ADMIN_PROJECT_ID: "test"
          FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "test"
          R2_ACCOUNT_ID: "test"
          R2_ACCESS_KEY_ID: "test"
          R2_SECRET_ACCESS_KEY: "test"
          R2_BUCKET_NAME: "test"
          WHATSAPP_ACCESS_TOKEN: "test"
          WHATSAPP_PHONE_NUMBER_ID: "test"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test"
          NODE_ENV: "test"

  # ─── Initial JS budgets ─────────────────────────────────────────────────────
  # Every route's initial JavaScript (the chunks referenced by its prerendered
  # HTML, gzipped) must stay under its budget in scripts/bundle-budgets.json.
  #
  # The budgets are tight on purpose. Two regressions this gate exists to
  # catch already happened here: the Firestore SDK shipping to every public
  # page because the root layout imported a profile service, and the whole
  # country/flag dataset loading on /requests/new for a form hidden behind a
  # modal. Both were invisible without measuring, and neither was caught by
  # any build-time check.
  #
  # Builds with production env rather than reusing the `build` job: NODE_ENV
  # and the env vars are inlined into the client bundle at build time, so the
  # measured sizes have to come from the same configuration that ships.
  bundle-budget:
    name: Bundle Budget
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          # Use REAL production env vars from secrets so the measured bundle
          # matches what actually ships. Dummy values would miss feature flags,
          # Firebase config size differences, PayPal SDK inclusion, etc.
          NODE_ENV: "production"
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          PAYPAL_API_URL: ${{ secrets.PAYPAL_API_URL }}
          PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Check initial JS budgets
        # Fails when a route grows past its budget, when a prerendered route
        # has no budget entry, or when nothing could be measured. The table it
        # prints (route, actual, budget, delta) is the report; a red run shows
        # which route grew and by how much.
        run: npm run check:bundle-budget

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production dependencies, high/critical)
        # Build/test tooling is excluded, and the one remaining advisory that
        # has no fixed release is allowlisted with a dated expiry in
        # scripts/audit-gate.mjs. Everything else fails the job.
        run: npm run audit:gate

      - name: Report unpinned dependencies
        # Advisory only. The manifest intentionally uses caret ranges, so a
        # hard failure here would turn every run red without changing anything.
        run: |
          UNPINNED=$(jq -r '.dependencies | to_entries[] | select(.value | startswith("^") or startswith("~")) | "\(.key): \(.value)"' apps/web/package.json)
          if [ -n "$UNPINNED" ]; then
            echo "::warning::Dependencies using caret/tilde ranges:"
            echo "$UNPINNED"
          fi

      - name: Verify lockfile integrity
        run: npm ci --package-lock-only --ignore-scripts

  test:
    name: Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Vitest skips a glob-keyed threshold that matches no files without
      # saying so, so a typo — or a subtree that gets renamed into another
      # directory — would drop a payment or compliance gate while this job
      # stayed green. The check reads the same globs the config uses and takes
      # a second, so it runs before the suite rather than after it.
      - name: Verify coverage globs resolve
        run: npm run check:coverage-globs

      # Coverage thresholds are global, so one well-tested compliance module
      # hides a new neighbour that has no tests at all. This check requires a
      # colocated `*.test.ts` for every module under src/lib/compliance and
      # takes a second, so it runs before the suite.
      - name: Verify compliance modules have tests
        run: npm run check:compliance-tests

      # The glob check proves each glob still matches a file; this proves each
      # money-path file still matches a glob. A new wallet or refund module
      # would otherwise inherit the global thresholds silently.
      - name: Verify money-path files are under a stricter floor
        run: npm run check:money-globs

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          # Dummy env vars for build-time validation
          PAYPAL_CLIENT_ID: "test"
          PAYPAL_CLIENT_SECRET: "test"
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "test"
          PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
          PAYPAL_ENV: "sandbox"
          SMTP_EMAIL: "test@test.com"
          SMTP_PASSWORD: "test"
          FIREBASE_ADMIN_PROJECT_ID: "test"
          FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "test"
          R2_ACCOUNT_ID: "test"
          R2_ACCESS_KEY_ID: "test"
          R2_SECRET_ACCESS_KEY: "test"
          R2_BUCKET_NAME: "test"
          WHATSAPP_ACCESS_TOKEN: "test"
          WHATSAPP_PHONE_NUMBER_ID: "test"
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          NODE_ENV: "test"

      # Component .tsx files are excluded from the main coverage run - folded
      # into the global aggregate they would drag it below its floor - so the
      # component layer gets its own gate: an aggregate floor over
      # src/components .tsx files, measured against the colocated component
      # tests. See docs/AUDIT.md section 2.10.
      - name: Run component coverage gate
        run: npm run test:coverage:components
        env:
          PAYPAL_CLIENT_ID: "test"
          PAYPAL_CLIENT_SECRET: "test"
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "test"
          PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
          PAYPAL_ENV: "sandbox"
          SMTP_EMAIL: "test@test.com"
          SMTP_PASSWORD: "test"
          FIREBASE_ADMIN_PROJECT_ID: "test"
          FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "test"
          R2_ACCOUNT_ID: "test"
          R2_ACCESS_KEY_ID: "test"
          R2_SECRET_ACCESS_KEY: "test"
          R2_BUCKET_NAME: "test"
          WHATSAPP_ACCESS_TOKEN: "test"
          WHATSAPP_PHONE_NUMBER_ID: "test"
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          NODE_ENV: "test"

  # ─── Test-order independence ────────────────────────────────────────────────
  # The unit suite runs with `isolate: true` (per-file isolation), but Vitest's
  # `sequence.shuffle` still randomizes file order across workers. A mock or a
  # module-level cache leaking between files fails here, instead of passing by
  # luck on whatever order the filesystem happened to return.
  #
  # Reproduce a failure locally with the seed Vitest prints in its output:
  #   node scripts/run-test-shuffle-ci.js --sequence.seed=<seed>
  #
  # Fix the FILE that fails, not the shared setup: `vi.resetModules()` plus
  # `await import()` of the module under test in `beforeEach`, as
  # src/lib/appCheck.test.ts does. A registry reset in vitest.setup.ts would
  # hand every file a private module graph and quietly delete the class of leak
  # this job exists to catch — it did briefly, and the shuffle guarantee was not
  # true while it was there.
  test-order-independence:
    name: Test Order Independence
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run tests in shuffled file order
        # Three fixed seeds: any single ordering can pass while another exposes
        # cross-file coupling, so one seed would let CI go green on a lucky
        # order. Fixed rather than random so a red run is reproducible from the
        # log alone; rotate or add a seed when you want more coverage.
        # `npm run test:shuffle -- --sequence.seed=N` does NOT forward the flag:
        # npm reads it as its own config, warns "Unknown cli config
        # --sequence.seed" and runs vitest with a clock-derived seed. This job
        # therefore ran three random orders while advertising three fixed ones,
        # which is why a red nightly was not replayable from CI. The wrapper
        # invokes vitest directly, so the seed is the seed.
        run: |
          set -euo pipefail
          for seed in 104729 130363 155921; do
            node scripts/run-test-shuffle-ci.js --sequence.seed=$seed
          done
        env:
          PAYPAL_CLIENT_ID: "test"
          PAYPAL_CLIENT_SECRET: "test"
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "test"
          PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
          PAYPAL_ENV: "sandbox"
          SMTP_EMAIL: "test@test.com"
          SMTP_PASSWORD: "test"
          FIREBASE_ADMIN_PROJECT_ID: "test"
          FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "test"
          R2_ACCOUNT_ID: "test"
          R2_ACCESS_KEY_ID: "test"
          R2_SECRET_ACCESS_KEY: "test"
          R2_BUCKET_NAME: "test"
          WHATSAPP_ACCESS_TOKEN: "test"
          WHATSAPP_PHONE_NUMBER_ID: "test"
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          NODE_ENV: "test"

  # ─── E2E smoke tests ────────────────────────────────────────────────────────
  #
  # By default E2E runs against a PRODUCTION build (next build + next start),
  # which is far more stable than the dev server used previously.
  #
  # If the `E2E_STAGING_URL` repository secret is set, tests run against
  # that live staging environment instead — recommended once staging exists.
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    env:
      # Optional: point E2E at a live staging environment by setting the
      # E2E_STAGING_URL repository secret (e.g. https://shipin-staging.vercel.app).
      E2E_STAGING_URL: ${{ secrets.E2E_STAGING_URL }}
      # Credentials for the destructive staging refund smoke test. Left unset,
      # that step skips itself so forks and PRs stay green.
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Only the steps that WRITE to staging (fixture seed, refund smoke,
      # fixture cleanup) need these. Unset, those steps skip themselves, so a
      # repo with a staging admin but no service account still runs the
      # read-only signed-in smoke instead of failing the whole job.
      E2E_FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
      E2E_REFUND_REQUEST_ID: ${{ secrets.E2E_REFUND_REQUEST_ID }}
      E2E_REFUND_CUSTOMER_ID: ${{ secrets.E2E_REFUND_CUSTOMER_ID }}
      # Dummy values for the production server this job builds and starts. They
      # are job-level because the build and the running server validate the same
      # variables at startup: keeping them on the build step alone meant every
      # later step died with a 60s `webServer` timeout. NODE_ENV is deliberately
      # absent here - at job level it makes `npm ci` skip devDependencies, and
      # Playwright lives in them.
      PAYPAL_CLIENT_ID: "test"
      PAYPAL_CLIENT_SECRET: "test"
      # Optional sandbox id; unset, the PayPal SDK spec skips itself.
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.E2E_PAYPAL_CLIENT_ID || 'test' }}
      PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
      PAYPAL_ENV: "sandbox"
      PAYPAL_WEBHOOK_ID: "test"
      SMTP_EMAIL: "test@test.com"
      SMTP_PASSWORD: "test"
      RESEND_API_KEY: "test"
      # The production server refuses to boot without a session-signing secret
      # (`validateProductionRequiredEnv`), and there is no .env.local here. The
      # local suite used to be skipped whenever E2E_STAGING_URL was set, so this
      # was never needed in the job — the server answered with a fatal
      # "Missing required production environment variables" only once the step
      # started running again. Dummy value, min 32 chars.
      MFA_SESSION_SECRET: "shipin-e2e-mfa-session-secret-0123456789"
      FIREBASE_ADMIN_PROJECT_ID: "test"
      FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
      FIREBASE_ADMIN_PRIVATE_KEY: "test"
      R2_ACCOUNT_ID: "test"
      R2_ACCESS_KEY_ID: "test"
      R2_SECRET_ACCESS_KEY: "test"
      R2_BUCKET_NAME: "test"
      APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_FIREBASE_API_KEY: "test"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "test.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "test"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "test-bucket"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:abcdef"
      # Points firebase-admin at the emulator started below instead of at a
      # service account. Never set in a real deployment.
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
      # Optional, and never required: without a store the server warns and
      # /api/health reports `degraded`.
      UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The suite is a Java process (firebase-tools 15 refuses runtimes below
      # Java 21), and the runner's JDK check only proves one exists — the
      # ubuntu-latest image does not necessarily ship a new enough one.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A production build must actually execute its JavaScript. This catches
      # the failure mode where every page renders correctly but nothing
      # hydrates — a CSP with a nonce the prerendered HTML can never carry,
      # a bundling change, a MIME/type regression. Smoke tests asserting page
      # text pass straight through that, which is how it shipped once.
      # Always local, never E2E_STAGING_URL.
      #
      # Unconditional on purpose. This used to run only when E2E_STAGING_URL was
      # empty, so configuring staging — the recommended setup — silently turned
      # off the only coverage of hydration, the emulator-backed signed-in specs
      # and the passkey ceremony, which cannot run remotely because it registers
      # a credential. Staging adds real-database coverage; it does not replace
      # any of that.
      #
      # One definition of the suite: `apps/web/scripts/e2e-local.mjs` builds and
      # serves the production bundle, owns `emulators:exec` for Firestore + Auth,
      # seeds the admin and runs the spec list. Repeating any of that here is how
      # the two drifted — the duplicate env once silently skipped both signed-in
      # specs. The job env keeps only the startup dummies the build and server
      # validate, which the staging steps need too.
      - name: Run local E2E specs (production build, Firestore + Auth emulators)
        run: npm run test:e2e:signed-in

      # CI and the Vercel deployment both start from the same push, so a
      # staging spec can reach the deployment that is being replaced while the
      # new one is still building. Waiting here is what tells the two apart:
      # the previous deployment answered 500 on every route (the boot
      # instrumentation hook could not load firebase-admin/app-check), and the
      # signed-in smoke test then timed out clicking "Sign in with email" on a
      # page that never rendered. `/api/health` answers 200 whenever the process
      # is up, degraded or not, so this only waits for a server that can serve.
      - name: Wait for the staging deployment to answer
        if: env.E2E_STAGING_URL != ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$E2E_STAGING_URL/api/health" > /dev/null; then
              echo "Staging answered on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${E2E_STAGING_URL} did not answer within 10 minutes."
          exit 1

      # The write path needs a service account; without one it would fail on a
      # missing variable instead of skipping, and a failing step takes the
      # read-only signed-in smoke down with it.
      - name: Note skipped staging write tests
        if: env.E2E_STAGING_URL != '' && env.E2E_ADMIN_EMAIL != '' && env.E2E_FIREBASE_ADMIN_PROJECT_ID == ''
        run: |
          echo "::warning::E2E_FIREBASE_ADMIN_PROJECT_ID is not set, so the refund fixture seed, the admin refund smoke and the fixture cleanup were skipped. They write to staging and need the staging service account."
          {
            echo "### Staging write tests skipped"
            echo ""
            echo "The staging admin account is configured but no service account is, so the refund smoke did not run."
          } >> "$GITHUB_STEP_SUMMARY"

      # Each refund run consumes its fixture, so make a new one first. The
      # seeder writes `E2E_REFUND_REQUEST_ID` / `E2E_REFUND_CUSTOMER_ID` into
      # GITHUB_ENV for the step below. Skipped when the ids are supplied as
      # secrets instead (e.g. a pre-seeded request).
      - name: Seed a fresh refund fixture (staging)
        if: env.E2E_STAGING_URL != '' && env.E2E_ADMIN_EMAIL != '' && env.E2E_FIREBASE_ADMIN_PROJECT_ID != '' && env.E2E_REFUND_REQUEST_ID == ''
        run: node apps/web/scripts/e2e/seed-refund-fixture.mjs >> "$GITHUB_ENV"
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.E2E_FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.E2E_FIREBASE_ADMIN_PRIVATE_KEY }}
          # Must equal the project id: staging-only guard inside the seeder.
          E2E_SEED_CONFIRM: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}

      # Moves real money, so it only runs against staging with a seeded fixture
      # (see playwright-test/tests/admin-refund.spec.ts for the seed shape and
      # the environment it needs). Each run consumes that fixture.
      - name: Run admin refund smoke test (staging)
        if: env.E2E_STAGING_URL != '' && env.E2E_ADMIN_EMAIL != '' && env.E2E_FIREBASE_ADMIN_PROJECT_ID != ''
        run: npx playwright test --config=apps/web/playwright.config.ts apps/web/playwright-test/tests/admin-refund.spec.ts
        env:
          BASE_URL: ${{ env.E2E_STAGING_URL }}
          PLAYWRIGHT_MANAGE_WEBSERVER: "0"

      # Read-only counterpart to the refund smoke: signs in through the real
      # login page and checks the paths only a session can reach — the admin
      # area and the dashboard's Firestore reads. The hydration contract runs
      # against the local build, so it can never cover these. Skips itself when
      # the staging credentials are absent, so forks stay green.
      - name: Run signed-in smoke test (staging)
        if: env.E2E_STAGING_URL != '' && env.E2E_ADMIN_EMAIL != ''
        run: npx playwright test --config=apps/web/playwright.config.ts apps/web/playwright-test/tests/signed-in-smoke.spec.ts
        env:
          BASE_URL: ${{ env.E2E_STAGING_URL }}
          PLAYWRIGHT_MANAGE_WEBSERVER: "0"

      # Sweeps fixtures left by this and earlier runs. `always()` so a failed
      # smoke run does not litter staging, and `--apply` because the script is
      # read-only by default (a human running it by hand only sees the plan).
      # Only documents marked `e2eFixture: true` and older than the TTL are
      # removed; audit log entries are kept.
      - name: Clean up stale refund fixtures (staging)
        if: always() && env.E2E_STAGING_URL != '' && env.E2E_ADMIN_EMAIL != '' && env.E2E_FIREBASE_ADMIN_PROJECT_ID != ''
        run: node apps/web/scripts/e2e/cleanup-refund-fixtures.mjs --apply
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.E2E_FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.E2E_FIREBASE_ADMIN_PRIVATE_KEY }}
          E2E_SEED_CONFIRM: ${{ secrets.E2E_FIREBASE_ADMIN_PROJECT_ID }}
          E2E_FIXTURE_TTL_HOURS: "6"

  # ─── Firestore security rules ───────────────────────────────────────────────
  # Runs the real `firestore.rules` against the Firestore emulator. The unit
  # suite's `src/lib/firestoreRules.test.ts` re-implements the rules as JS
  # closures, so only this job can catch a rules change that reopens a hole —
  # a customer writing `wallets/{uid}.balance`, marking their own request
  # `paid`, or granting themselves `role: "admin"`.
  rules-tests:
    name: Firestore Rules
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # The Firestore emulator is a Java process, and firebase-tools 15 refuses
      # runtimes below Java 21 (`Java version before 21` at emulator start).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Starts the emulator, runs vitest against firestore.rules, and stops the
      # emulator again. A rules file that fails to compile, or an assertion that
      # flips, fails the job.
      - name: Run Firestore rules tests
        run: npm run test:rules

  # ─── Accessibility audit ────────────────────────────────────────────────────
  a11y:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          package-manager: npm@12.2.2

      - name: Enable corepack (respects packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run axe-core contract tests
        run: npm run test:security --workspace=@shipin/web -- src/lib/axeScan.test.ts