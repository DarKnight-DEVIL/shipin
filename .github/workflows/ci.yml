name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # Dummy env vars for build-time validation
          PAYPAL_CLIENT_ID: "test"
          PAYPAL_CLIENT_SECRET: "test"
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: "test"
          PAYPAL_API_URL: "https://api-m.sandbox.paypal.com"
          PAYPAL_ENV: "sandbox"
          SMTP_EMAIL: "test@test.com"
          SMTP_PASSWORD: "test"
          FIREBASE_ADMIN_PROJECT_ID: "test"
          FIREBASE_ADMIN_CLIENT_EMAIL: "test@test.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "test"
          R2_ACCOUNT_ID: "test"
          R2_ACCESS_KEY_ID: "test"
          R2_SECRET_ACCESS_KEY: "test"
          R2_BUCKET_NAME: "test"
          WHATSAPP_ACCESS_TOKEN: "test"
          WHATSAPP_PHONE_NUMBER_ID: "test"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Check for unpinned dependencies
        run: |
          # Fail if any dependency uses a caret (^) or tilde (~) range
          UNPINNED=$(jq -r '.dependencies | to_entries[] | select(.value | startswith("^") or startswith("~")) | "\(.key): \(.value)"' package.json)
          if [ -n "$UNPINNED" ]; then
            echo "Unpinned dependencies found:"
            echo "$UNPINNED"
            exit 1
          fi

      - name: Verify lockfile integrity
        run: npm ci --package-lock-only --ignore-scripts

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present