# Local full stack: the production image (Dockerfile) against the Firestore and
# Auth emulators. No Firebase project and no service account are needed.
#
#   docker compose up --build      # app on http://localhost:3000
#   docker compose down            # emulator data is discarded with it
#
# This is a local-only build: the browser bundle it produces points at the
# emulators, and the server variables below are placeholders. Never deploy it.
# Documented in DEPLOYMENT.md ("Local full stack with docker compose").
#
# Server secrets are loaded from .env.local at the repository root
# (gitignored). Create it from the app's template, then fill in real values for
# local testing against the emulators:
#
#   cp apps/web/.env.example .env.local
#
# If .env.local is missing, the stack will fail fast with a clear error instead
# of silently using placeholders.
name: shipin-local

# Client configuration. `next build` inlines every NEXT_PUBLIC_* value into the
# bundle, so these have to be present at BUILD time — `-e NEXT_PUBLIC_…` on a
# container cannot change what the browser loads. They are also given to the
# runtime, because server components read the same module while rendering.
#
# The emulator hosts are `localhost:<port>`, not `emulators:<port>`: the ports
# are published, and the browser doing the work is on the host, outside the
# compose network. The project id has to match the emulators' `--project`,
# because both emulators namespace their data by it.
x-client-config: &client-config
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_PAYPAL_CLIENT_ID: test-paypal-client-id
  NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-shipin
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-shipin.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:local"
  NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
  NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: localhost:8080
  # App Check stays off: no NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY is passed,
  # and an empty site key disables it instead of failing (src/lib/firebase.ts).

services:
  emulators:
    build:
      context: docker
      dockerfile: firebase-emulators.Dockerfile
    ports:
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
    working_dir: /workspace
    environment:
      # firebase-tools prompts for usage reporting on a fresh profile; CI mode
      # makes it non-interactive, which is what a detached container needs.
      CI: "1"
    volumes:
      # Read-only: the emulators only read these, and the container must not be
      # able to rewrite the repository's rules or index definitions.
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
      # The emulator jars live in the CLI's cache; keeping it in a volume makes
      # the second start fast and offline-capable.
      - emulator-cache:/home/node/.cache/firebase
    healthcheck:
      # A real TCP connect to both ports: `firebase` prints "All emulators
      # ready" on stdout, but the app must not start on a partial stack.
      test:
        - CMD
        - node
        - -e
        - |
          const net = require("node:net");
          const probe = (port) =>
            new Promise((resolve, reject) => {
              const socket = net.connect(port, "127.0.0.1", () => {
                socket.end();
                resolve();
              });
              socket.on("error", reject);
              socket.setTimeout(2000, () => socket.destroy(new Error("timeout")));
            });
          Promise.all([probe(8080), probe(9099)]).then(
            () => process.exit(0),
            () => process.exit(1)
          );
      interval: 5s
      timeout: 5s
      retries: 24
      # Covers the first-run download of the emulator jars.
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *client-config
    ports:
      - "3000:3000"
    env_file:
      - .env.local  # Required: contains real server secrets for local testing
    environment:
      <<: *client-config
      NODE_ENV: production
      PORT: "3000"

      # The server talks to the emulators over the compose network, so these are
      # service names rather than localhost. The Admin SDK drops its
      # service-account credential as soon as FIRESTORE_EMULATOR_HOST is set
      # (src/lib/firebaseAdmin.ts), and the Auth emulator accepts the same
      # tokens the browser signs in with.
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      FIREBASE_ADMIN_PROJECT_ID: demo-shipin

      # WebAuthn relying party and the CORS/email origin: a production server
      # refuses a shared-hosting origin, and localhost is what is actually being
      # served.
      APP_URL: http://localhost:3000

      # The stack has no Redis and no MFA denylist store. Both opt-outs exist
      # for exactly this case (E2E and local runs): without them the preflight
      # exits and every admin elevation is rejected. They must never be set on a
      # deployment.
      RATE_LIMIT_STORE_OPTIONAL: "1"
      # APP_URL loopback exemption for E2E only — independent of the rate-limit store
      APP_URL_E2E_OPTIONAL: "1"
      MFA_DENYLIST_OPTIONAL: "1"
    depends_on:
      emulators:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Log aggregation. Opt-in: `docker compose --profile observability up`.
  #
  # The default stack stays as it was, because two more containers (and a disk
  # buffer) are not what someone running the test suite wants. Nothing here is
  # required for the app to work: the app logs one JSON line per entry to stdout,
  # and this pipeline is what turns those lines into something queryable.
  #
  # LOKI_URL / LOKI_USERNAME / LOKI_PASSWORD come from the environment (or
  # .env.local). Unset, Vector pushes to the local Loki below. Point them at
  # Grafana Cloud and the same pipeline ships there - it is the same push API.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  vector:
    image: timberio/vector:0.44.0-debian
    profiles: ["observability"]
    volumes:
      # Read-only: the shipper reads container log files, it never controls Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/vector/vector.toml:/etc/vector/vector.toml:ro
      # Survives a Vector restart, so a Loki outage does not lose the records from
      # the incident that caused it.
      - vector-data:/var/lib/vector
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      VECTOR_LOG: info
    depends_on:
      - loki

volumes:
  emulator-cache:
  loki-data:
  vector-data:
